<style>
:root{
  --sea:#060d18; --land:#172a43; --ink:#e9eef5; --muted:#9fb0c4; --line:rgba(255,255,255,.12);
  --card:rgba(10,21,36,.86); --accent:#f4a261; --red:#ff3b3b;
  --serif:"Fraunces",Georgia,serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--sea);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

#map{position:fixed;inset:0;z-index:0}
#vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 60% 50%,transparent 45%,rgba(5,10,18,.75) 100%),
             linear-gradient(90deg,rgba(5,10,18,.55) 0%,transparent 45%)}
body.mode-jelajah #vignette{opacity:.35}
body.mode-jelajah:not(.zoomed) .lm .name{display:none}

/* header */
header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:24px;
  padding:14px 28px;background:linear-gradient(180deg,rgba(5,10,18,.9),rgba(5,10,18,0))}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--serif);font-weight:800;font-size:1.25rem;letter-spacing:.02em}
.brand span{font-size:.7rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.tabs{display:flex;gap:4px;margin-left:auto;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{padding:7px 16px;border-radius:999px;font-size:.85rem;font-weight:500;color:var(--muted);transition:.2s}
.tabs button[aria-current="true"]{background:var(--ink);color:#0a1524}
.lang{display:flex;gap:2px;font-size:.75rem;font-weight:600}
.lang button{padding:6px 8px;color:var(--muted);border-radius:6px}
.lang button[aria-pressed="true"]{color:var(--ink);background:rgba(255,255,255,.08)}
#progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:30;transition:width .15s,background .4s}

/* chapter dots */
#dots{position:fixed;left:22px;top:50%;transform:translateY(-50%);z-index:15;display:flex;flex-direction:column;gap:14px}
#dots button{position:relative;width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.45);transition:.25s}
#dots button.on{background:var(--c,#fff);border-color:var(--c,#fff);transform:scale(1.35)}
#dots button span{position:absolute;left:24px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:.75rem;
  background:var(--card);padding:4px 9px;border-radius:6px;opacity:0;pointer-events:none;transition:.2s}
#dots button:hover span,#dots button:focus-visible span{opacity:1}
body.mode-galeri #dots,body.mode-jelajah #dots{display:none}

/* story */
#story{position:relative;z-index:10;pointer-events:none}
body:not(.mode-cerita) #story{display:none}
.step{min-height:100vh;display:flex;align-items:center;padding:0 0 0 68px}
.hero{flex-direction:column;align-items:flex-start;justify-content:center;padding-left:9vw}
.hero .eyebrow{font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
.hero h1{font-family:var(--serif);font-weight:800;font-size:clamp(3.4rem,10vw,8.5rem);line-height:.9;letter-spacing:-.02em}
.hero h2{font-family:var(--serif);font-weight:400;font-style:italic;font-size:clamp(1.4rem,3vw,2.3rem);color:#cfd9e6;margin:14px 0 22px}
.hero p{max-width:460px;color:var(--muted);line-height:1.65}
.scrollcue{margin-top:48px;display:flex;align-items:center;gap:12px;font-size:.75rem;letter-spacing:.25em;text-transform:uppercase;color:var(--muted)}
.scrollcue i{width:22px;height:36px;border:2px solid var(--muted);border-radius:12px;position:relative}
.scrollcue i::after{content:"";position:absolute;left:50%;top:7px;width:4px;height:7px;margin-left:-2px;border-radius:2px;background:var(--ink);animation:cue 1.8s infinite}
@keyframes cue{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(12px)}}

.card{pointer-events:auto;width:min(430px,calc(100vw - 32px));background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45);
  opacity:.25;transform:translateY(24px);transition:opacity .6s,transform .6s}
.step.active .card{opacity:1;transform:none}
.card .art{height:170px;display:block;width:100%}
.photo{display:grid;gap:2px;height:200px;background:#05090f}
.photo.n2{grid-template-columns:1fr 1fr}
.photo figure{position:relative;overflow:hidden;margin:0}
.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 6s ease}
.step.active .photo img{transform:scale(1.06)}
.photo figure::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(5,10,18,.85))}
.photo figcaption{position:absolute;left:10px;bottom:8px;z-index:1;font-size:.7rem;font-weight:600;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:rgba(5,10,18,.6);border:1px solid var(--c,#fff)}
.gcard .photo{height:170px}
#info .photo{height:170px}
.card .body{padding:22px 24px 24px}
.kicker{display:flex;align-items:center;gap:10px;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--c);font-weight:600}
.kicker em{font-style:normal;color:var(--muted);letter-spacing:.1em}
.card h3{font-family:var(--serif);font-weight:600;font-size:1.85rem;line-height:1.1;margin:10px 0 12px}
.card .sub{font-family:var(--serif);font-style:italic;color:var(--muted);margin:-6px 0 12px;font-size:1.05rem}
.card p{color:#c6d2e0;line-height:1.7;font-size:.97rem}
.stats{display:flex;gap:22px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--serif);font-size:1.4rem;font-weight:600}
.stats span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chips span{font-size:.75rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:#dbe4ee}
.chips span.hot{border-color:var(--red);color:#ffb3b3}
.outro .card{text-align:left}
.cta{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{padding:11px 18px;border-radius:999px;font-weight:600;font-size:.9rem;background:var(--ink);color:#0a1524}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.35)}

/* map markers */
.dlabel{font-family:var(--serif);font-weight:600;font-size:13px;color:rgba(233,238,245,.55);text-shadow:0 1px 6px #000;
  white-space:nowrap;pointer-events:none;transition:color .4s,font-size .4s;letter-spacing:.02em}
.dlabel.on{color:#fff;font-size:17px}
.lm{position:relative;width:12px;height:12px;pointer-events:none}
.lm .dot{position:absolute;inset:0;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.lm .ring{position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--c);animation:ring 2s infinite}
@keyframes ring{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
.lm .name{position:absolute;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:12px;font-weight:600;
  background:rgba(5,10,18,.85);border:1px solid var(--line);padding:3px 8px;border-radius:6px;left:20px}
.lm.l .name{left:auto;right:20px}
.lm.tr .name{transform:translateY(-130%)}
.lm.br .name{transform:translateY(30%)}
.lm{visibility:hidden;transform:scale(.3);transition:transform .35s,visibility .35s}
.lm.show{visibility:visible;transform:none}

/* legend */
#legend{position:fixed;right:22px;bottom:34px;z-index:12;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;font-size:.78rem;color:#cbd6e3;display:none;min-width:190px}
#legend.show{display:block}
#legend .row{display:flex;align-items:center;gap:8px;margin:4px 0}
#legend i{width:14px;height:14px;border-radius:3px;background:var(--red);animation:pulse 1.4s infinite alternate}
@keyframes pulse{from{opacity:.4}to{opacity:1}}

/* gallery */
#gallery{position:fixed;inset:0;z-index:18;overflow:auto;padding:100px 6vw 60px;background:rgba(5,10,18,.82);backdrop-filter:blur(6px);display:none}
body.mode-galeri #gallery{display:block}
#gallery h2{font-family:var(--serif);font-size:2.4rem;font-weight:600}
#gallery > p{color:var(--muted);margin:8px 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.gcard{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .25s,border-color .25s}
.gcard:hover{transform:translateY(-4px);border-color:var(--c)}
.gcard svg{display:block;width:100%;height:150px}
.gcard div{padding:14px 16px 18px}
.gcard small{color:var(--c);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.gcard h4{font-family:var(--serif);font-size:1.25rem;font-weight:600;margin-top:6px}

/* explore */
#explore{position:fixed;left:22px;top:86px;z-index:16;width:270px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:none;max-height:calc(100vh - 110px);overflow:auto}
body.mode-jelajah #explore{display:block}
#explore h3{font-family:var(--serif);font-size:1.3rem;font-weight:600}
#explore h5{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
#explore label{display:flex;align-items:center;line-height:1.25;gap:10px;padding:6px 0;font-size:.88rem;cursor:pointer}
#explore input{accent-color:var(--c,#f4a261);width:16px;height:16px}
#explore label i{width:12px;height:12px;border-radius:3px;background:var(--c)}
#explore .hint{font-size:.78rem;color:var(--muted);line-height:1.5;margin-top:6px}
#explore small{display:block;font-size:.7rem;color:var(--muted);margin:-2px 0 4px 26px}
#info{position:fixed;right:22px;top:86px;z-index:16;width:300px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:none}
#info.show{display:block}
body:not(.mode-jelajah) #info{display:none}
#info .body{padding:16px 18px 18px}
#info h4{font-family:var(--serif);font-size:1.4rem;font-weight:600;margin:6px 0 8px}
#info p{font-size:.88rem;color:#c6d2e0;line-height:1.6}
#info .x{position:absolute;right:10px;top:8px;font-size:1.3rem;color:#fff;text-shadow:0 1px 4px #000}
.maplibregl-popup-content{background:var(--card);color:var(--ink);font:600 12px var(--sans);padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
.maplibregl-popup-tip{display:none}
.maplibregl-ctrl-attrib{background:rgba(5,10,18,.6)!important;color:var(--muted)}
.maplibregl-ctrl-attrib a{color:var(--muted)}

@media (max-width:720px){
  header{padding:10px 14px;gap:10px}
  .brand span{display:none}
  .tabs button{padding:6px 10px;font-size:.78rem}
  #dots{left:8px;gap:10px}
  .step{padding:0 12px 0 28px;align-items:flex-end;padding-bottom:6vh}
  .hero{align-items:flex-start;padding-left:28px;justify-content:center}
  .card .art{display:none}
  .card .photo{height:110px}
  .card .body{padding:16px 18px}
  .card p{font-size:.9rem;line-height:1.55}
  .stats{margin-top:12px;padding-top:10px}
  body.mode-cerita #legend{display:none!important}
  .card h3{font-size:1.5rem}
  #explore{left:10px;right:10px;width:auto;top:auto;bottom:10px;max-height:45vh}
  #info{left:10px;right:10px;width:auto;top:70px}
  #legend{right:10px;bottom:10px}
  #vignette{background:linear-gradient(0deg,rgba(5,10,18,.7) 0%,transparent 55%)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  const s = `stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
  let g = "";
  if(id==="jakpus"){
    const b=[[30,70,40],[78,40,34],[118,90,30],[154,25,42],[202,60,36],[244,10,30],[280,75,44],[330,50,40]];
    g = b.map(([x,y,w])=>`<rect x="${x}" y="${y+20}" width="${w}" height="${160-y}" fill="#0a1524" stroke="${c}" stroke-width="1.5"/>`+
      Array.from({length:Math.floor((140-y)/14)},(_,i)=>`<line x1="${x+6}" y1="${y+32+i*14}" x2="${x+w-6}" y2="${y+32+i*14}" stroke="${c}" stroke-opacity=".35"/>`).join("")).join("");

         <path d="M240 115 H360 Q355 160 300 160 Q245 160 240 115 Z" ${s} fill="#0a1524"/><path d="M270 100 q8-12 0-24 q-8-12 0-24 M300 100 q8-12 0-24 q-8-12 0-24 M330 100 q8-12 0-24 q-8-12 0-24" stroke="${c}" stroke-width="2" fill="none"/>

        `<circle cx="120" cy="100" r="12" fill="${c}"/><path d="M0 30 Q100 60 200 30 T400 30" stroke="#fff" stroke-opacity=".5" fill="none"/>`+

        `<path d="M250 140 V80 L320 68 V128" ${s}/><circle cx="240" cy="140" r="11" fill="#fff"/><circle cx="310" cy="128" r="11" fill="#fff"/>`;
  } else if(id==="jakut"){

/* ---------- state ---------- */
let lang = "id", mode = "cerita", activeIdx = 0, map, markers = {}, labels = {};
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const isMobile = () => innerWidth <= 720;
const T = k => UI[lang][k];
const C = ch => ch[lang+"_"];
const lmOf = id => LANDMARKS.features.filter(f=>f.properties.district===id);
// story steps: 0 = hero, 1..5 = chapters, 6 = outro
const STEPS = [null, ...CHAPTERS, null];

/* ---------- render ---------- */
function renderStory(){
  const s = document.getElementById("story");
  let h = `<section class="step hero" data-i="0"><div class="eyebrow">${T("eyebrow")}</div><h1>Jakarta</h1><h2>${T("heroSub")}</h2><p>${T("heroP")}</p>
           <div class="scrollcue"><i></i>${T("scroll")}</div></section>`;
  CHAPTERS.forEach((ch,i)=>{
    const c = C(ch), lms = lmOf(ch.id);
    h += `<section class="step" data-i="${i+1}" id="bab-${ch.id}"><article class="card" style="--c:${COLORS[ch.id]}">${media(ch.id)}
      <div class="body"><div class="kicker">${String(i+1).padStart(2,"0")} · ${c.theme}</div><h3>${c.title}</h3><div class="sub">${c.sub}</div><p>${c.body}</p>
      <div class="chips">${lms.map(f=>`<span>${f.properties.name}</span>`).join("")}${ch.congestion?`<span class="hot">● ${lang==="id"?"Macet":"Congested"}</span>`:""}</div>
      <div class="stats"><div><b>${AREA[ch.id]} km²</b><span>${T("area")}</span></div><div><b>${lms.length}</b><span>${T("landmarks")}</span></div>${ch.congestion?`<div><b>${CONGESTION.features.length}</b><span>${lang==="id"?"Sel macet":"Jam cells"}</span></div>`:""}</div>
      </div></article></section>`;
  });
  h += `<section class="step outro" data-i="6"><article class="card" style="--c:var(--accent)"><div class="body"><div class="kicker">${T("ch")} 06 · Jakarta</div><h3>${T("outroT")}</h3><p>${T("outroP")}</p>
        <div class="cta"><button class="btn" data-go="jelajah">${T("goExplore")}</button><button class="btn ghost" data-go="galeri">${T("goGallery")}</button></div></div></article></section>`;
  s.innerHTML = h;
  s.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>setMode(b.dataset.go));
  observeSteps();
  document.querySelector(`.step[data-i="${activeIdx}"]`)?.classList.add("active");
}

function renderDots(){
  const d = document.getElementById("dots");
  d.innerHTML = STEPS.map((ch,i)=>{
    const name = i===0 ? "Jakarta" : i===6 ? (lang==="id"?"Penutup":"Finale") : C(ch).title;
    return `<button data-i="${i}" style="--c:${ch?COLORS[ch.id]:"#fff"}" aria-label="${name}"><span>${name}</span></button>`;
  }).join("");
  d.querySelectorAll("button").forEach(b=>b.onclick=()=>scrollToStep(+b.dataset.i));
  markDots();
}
function markDots(){ document.querySelectorAll("#dots button").forEach(b=>b.classList.toggle("on", +b.dataset.i===activeIdx)); }

function renderGallery(){
  document.getElementById("grid").innerHTML = CHAPTERS.map((ch,i)=>{const c=C(ch);return `<button class="gcard" data-i="${i+1}" style="--c:${COLORS[ch.id]}">${media(ch.id)}<div><small>${String(i+1).padStart(2,"0")} · ${c.theme}</small><h4>${c.title}</h4></div></button>`}).join("");
  document.querySelectorAll(".gcard").forEach(b=>b.onclick=()=>{ setMode("cerita"); requestAnimationFrame(()=>scrollToStep(+b.dataset.i)); });
}

const exState = {themes:Object.fromEntries(Object.keys(COLORS).map(k=>[k,true])), lm:true, cong:true, grid:true, osm:false};
function renderExplore(){
  const e = document.getElementById("explore");
  e.innerHTML = `<h3>${T("exTitle")}</h3><p class="hint">${T("exHint")}</p><h5>${T("themes")}</h5>`+
    CHAPTERS.map(ch=>`<label style="--c:${COLORS[ch.id]}"><input type="checkbox" data-theme="${ch.id}" ${exState.themes[ch.id]?"checked":""}><i></i><span>${C(ch).title}<small style="margin:0;display:block">${C(ch).theme}</small></span></label>`).join("")+
    `<h5>${T("layers")}</h5>
     <label><input type="checkbox" data-l="lm" ${exState.lm?"checked":""}>${T("lmLayer")}</label>
     <label style="--c:var(--red)"><input type="checkbox" data-l="cong" ${exState.cong?"checked":""}>${T("congLayer")}</label>
     <label><input type="checkbox" data-l="grid" ${exState.grid?"checked":""}>${T("gridLayer")}</label>
     <label><input type="checkbox" data-l="osm" ${exState.osm?"checked":""}>${T("osmLayer")}</label><small>${T("osmNote")}</small>
     <div class="cta"><button class="btn ghost" data-go="cerita">← ${T("back")}</button></div>`;
  e.querySelectorAll("[data-theme]").forEach(i=>i.onchange=()=>{exState.themes[i.dataset.theme]=i.checked; applyMap();});
  e.querySelectorAll("[data-l]").forEach(i=>i.onchange=()=>{exState[i.dataset.l]=i.checked; applyMap();});
  e.querySelector("[data-go]").onclick=()=>setMode("cerita");
}

function showInfo(id){
  const ch = CHAPTERS.find(c=>c.id===id), c = C(ch), el = document.getElementById("info");
  el.innerHTML = `${media(id)}<button class="x" aria-label="close">×</button><div class="body" style="--c:${COLORS[id]}"><div class="kicker">${c.theme}</div><h4>${c.title}</h4><p>${c.body}</p>
    <div class="stats"><div><b>${AREA[id]} km²</b><span>${T("area")}</span></div><div><b>${lmOf(id).length}</b><span>${T("landmarks")}</span></div></div>
    <div class="cta"><button class="btn" data-read>${T("readStory")}</button></div></div>`;
  el.classList.add("show");
  el.querySelector(".x").onclick=()=>el.classList.remove("show");
  el.querySelector("[data-read]").onclick=()=>{ const i=CHAPTERS.indexOf(ch)+1; setMode("cerita"); requestAnimationFrame(()=>scrollToStep(i)); };
}

function renderText(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=T(el.dataset.t));
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  renderStory(); renderDots(); renderGallery(); renderExplore();
  if(document.getElementById("info").classList.contains("show")) document.getElementById("info").classList.remove("show");
}

/* ---------- scroll ---------- */
let io;
function observeSteps(){
  io?.disconnect();
  io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) setActive(+e.target.dataset.i); }), {rootMargin:"-45% 0px -45% 0px"});
  document.querySelectorAll(".step").forEach(s=>io.observe(s));
}
function scrollToStep(i){ document.querySelector(`.step[data-i="${i}"]`)?.scrollIntoView({behavior:reduced?"auto":"smooth", block:"center"}); }
function setActive(i){
  if(mode!=="cerita") return;
  activeIdx = i;
  document.querySelectorAll(".step").forEach(s=>s.classList.toggle("active", +s.dataset.i===i));
  markDots(); applyMap(); moveCamera();
}
addEventListener("scroll",()=>{
  const p = document.getElementById("progress"), h = document.documentElement.scrollHeight - innerHeight;
  p.style.width = mode==="cerita" && h>0 ? (scrollY/h*100)+"%" : "0";
  const ch = STEPS[activeIdx]; p.style.background = ch ? COLORS[ch.id] : "var(--accent)";
},{passive:true});

/* ---------- modes ---------- */
function setMode(m, fromHash){
  mode = m;
  document.body.classList.remove("mode-cerita","mode-galeri","mode-jelajah"); document.body.classList.add("mode-"+m);
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-current", b.dataset.mode===m));
  if(!fromHash && location.hash.slice(1)!==m) history.replaceState(null,"","#"+m);
  if(map){ const on = m==="jelajah"; ["dragPan","scrollZoom","doubleClickZoom","touchZoomRotate","keyboard","dragRotate","boxZoom"].forEach(k=>map[k][on?"enable":"disable"]()); }
  if(m==="cerita"){ requestAnimationFrame(()=>scrollToStep(activeIdx)); }
  else window.scrollTo(0,0);
  document.getElementById("progress").style.width="0";
  applyMap(); moveCamera();
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; renderText(); applyMap(); });
addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(["cerita","galeri","jelajah"].includes(h)&&h!==mode) setMode(h,true); });

/* ---------- map ---------- */
function grid(){
  const f=[]; for(let x=106.4;x<=107.3;x+=0.05) f.push({type:"Feature",geometry:{type:"LineString",coordinates:[[x,-6.7],[x,-5.8]]}});
  for(let y=-6.7;y<=-5.8;y+=0.05) f.push({type:"Feature",geometry:{type:"LineString",coordinates:[[106.4,y],[107.3,y]]}});
  return {type:"FeatureCollection",features:f};
}
function padding(){
  if(isMobile()) return {top:60,bottom:Math.round(innerHeight*.45),left:20,right:20};
  if(mode==="jelajah") return {top:60,bottom:20,left:300,right:20};
  return {top:60,bottom:40,left:Math.min(520,innerWidth*.42),right:40};
}
function initMap(){
  map = new maplibregl.Map({
    container:"map", center:OVERVIEW.center, zoom:OVERVIEW.zoom - (isMobile()?0.9:0), interactive:true, attributionControl:false,
    style:{version:8,sources:{},layers:[{id:"bg",type:"background",paint:{"background-color":"#060d18"}}]}
  });
  map.addControl(new maplibregl.AttributionControl({compact:true,customAttribution:"Batas © GADM 4.1 · demo REA"}));
  ["dragPan","scrollZoom","doubleClickZoom","touchZoomRotate","keyboard","dragRotate","boxZoom"].forEach(k=>map[k].disable());
  map.on("load",()=>{
    map.addSource("osm",{type:"raster",tiles:["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],tileSize:256,attribution:"© OpenStreetMap"});
    map.addLayer({id:"osm",type:"raster",source:"osm",layout:{visibility:"none"},paint:{"raster-saturation":-1,"raster-brightness-max":.45,"raster-opacity":.9}});
    map.addSource("grid",{type:"geojson",data:grid()});
    map.addLayer({id:"grid",type:"line",source:"grid",paint:{"line-color":"#ffffff","line-opacity":.05,"line-width":1}});
    map.addSource("ctx",{type:"geojson",data:CONTEXT});
    map.addLayer({id:"ctx-fill",type:"fill",source:"ctx",paint:{"fill-color":"#172a43","fill-opacity":1}});
    map.addLayer({id:"ctx-line",type:"line",source:"ctx",paint:{"line-color":"#2a4262","line-width":1}});
    map.addSource("d",{type:"geojson",data:DISTRICTS,promoteId:"id"});
    map.addLayer({id:"d-fill",type:"fill",source:"d",paint:{"fill-color":["match",["get","id"],...Object.entries(COLORS).flat(),"#888"],"fill-opacity":.4,"fill-opacity-transition":{duration:700}}});
    map.addLayer({id:"d-line",type:"line",source:"d",paint:{"line-color":"#ffffff","line-opacity":.55,"line-width":1.2}});
    map.addLayer({id:"d-active",type:"line",source:"d",filter:["==",["get","id"],"__"],paint:{"line-color":"#ffffff","line-width":3,"line-blur":.5}});
    map.addLayer({id:"d-glow",type:"line",source:"d",filter:["==",["get","id"],"__"],paint:{"line-color":["match",["get","id"],...Object.entries(COLORS).flat(),"#fff"],"line-width":12,"line-opacity":.35,"line-blur":8}});
    map.addSource("sud",{type:"geojson",data:SUDIRMAN});
    map.addLayer({id:"sud-glow",type:"line",source:"sud",layout:{visibility:"none","line-cap":"round"},paint:{"line-color":"#ff3b3b","line-width":18,"line-blur":12,"line-opacity":.6}});
    map.addSource("cong",{type:"geojson",data:CONGESTION});
    map.addLayer({id:"cong",type:"fill",source:"cong",layout:{visibility:"none"},paint:{"fill-color":"#ff3b3b","fill-opacity":.6}});
    map.addLayer({id:"cong-line",type:"line",source:"cong",layout:{visibility:"none"},paint:{"line-color":"#ffb3b3","line-width":.6}});

    // district labels + landmark markers (HTML — no glyph server needed)
    DISTRICTS.features.forEach(f=>{
      const id=f.properties.id, el=document.createElement("div"); el.className="dlabel"; el.textContent=f.properties.name;
      labels[id]=new maplibregl.Marker({element:el}).setLngLat(LABEL_AT[id]).addTo(map);
    });
    LANDMARKS.features.forEach((f,i)=>{
      const p=f.properties, wrap=document.createElement("div"), el=document.createElement("div");
      el.className="lm "+(LM_ANCHOR[p.name]||""); el.style.setProperty("--c",COLORS[p.district]);
      el.innerHTML=`<div class="ring"></div><div class="dot"></div><div class="name">${p.name}</div>`;
      wrap.appendChild(el);
      markers[i]={el,district:p.district,m:new maplibregl.Marker({element:wrap}).setLngLat(f.geometry.coordinates).addTo(map)};
    });

    // explore interactions
    const pop = new maplibregl.Popup({closeButton:false,closeOnClick:false,offset:12});
    let hov=null;
    map.on("mousemove","d-fill",e=>{ if(mode!=="jelajah") return; const id=e.features[0].properties.id; map.getCanvas().style.cursor="pointer";
      if(hov!==id){hov=id; applyMap(hov);} pop.setLngLat(e.lngLat).setText(e.features[0].properties.name).addTo(map); });
    map.on("mouseleave","d-fill",()=>{ map.getCanvas().style.cursor=""; hov=null; pop.remove(); applyMap(); });
    map.on("click","d-fill",e=>{ if(mode==="jelajah") showInfo(e.features[0].properties.id); });

    map.on("zoom",()=>document.body.classList.toggle("zoomed", map.getZoom()>=12.2));
    pulse(); applyMap(); moveCamera();
  });
}
function vis(id,on){ if(map.getLayer(id)) map.setLayoutProperty(id,"visibility",on?"visible":"none"); }
function applyMap(hoverId){
  if(!map || !map.isStyleLoaded() || !map.getLayer("d-fill")) return;
  const ch = mode==="cerita" ? STEPS[activeIdx] : null;
  const activeId = ch ? ch.id : null;
  // fill
  let op;
  if(mode==="jelajah"){
    op = ["case", ...Object.keys(COLORS).flatMap(k=>[["==",["get","id"],k], exState.themes[k] ? (k===hoverId?.7:.42) : .05]), .3];
  } else if(activeId){
    op = ["case",["==",["get","id"],activeId],.6,.06];
  } else op = .4;
  map.setPaintProperty("d-fill","fill-opacity",op);
  const hl = activeId || hoverId || "__";
  map.setFilter("d-active",["==",["get","id"],hl]); map.setFilter("d-glow",["==",["get","id"],hl]);
  // layers
  const showCong = mode==="jelajah" ? exState.cong : !!(ch && ch.congestion);
  ["cong","cong-line","sud-glow"].forEach(l=>vis(l,showCong));
  document.getElementById("legend").classList.toggle("show", showCong && mode!=="galeri");
  vis("grid", mode==="jelajah" ? exState.grid : true);
  vis("osm", mode==="jelajah" && exState.osm);
  Object.entries(labels).forEach(([id,m])=>m.getElement().classList.toggle("on", id===activeId || id===hoverId));
  Object.values(markers).forEach(o=>o.el.classList.toggle("show", mode==="jelajah" ? exState.lm && exState.themes[o.district] : o.district===activeId));
}
function moveCamera(){
  if(!map || !map.getLayer("d-fill")) return;
  const ch = mode==="cerita" ? STEPS[activeIdx] : null;
  let view = ch ? ch.view : OVERVIEW;
  if(mode==="jelajah") view = {...OVERVIEW, zoom:OVERVIEW.zoom+0.3};
  const z = view.zoom - (isMobile()?0.8:0);
  const opts = {center:view.center, zoom:z, pitch:view.pitch, bearing:view.bearing, padding:padding()};
  if(reduced) map.jumpTo(opts); else map.flyTo({...opts, duration:2200, curve:1.3, essential:true});
}
function pulse(){
  const t = performance.now()/1000;
  if(map.getLayer("cong") && map.getLayoutProperty("cong","visibility")==="visible" && !reduced){
    map.setPaintProperty("cong","fill-opacity",.38+.3*Math.sin(t*3));
    map.setPaintProperty("sud-glow","line-opacity",.35+.25*Math.sin(t*3));
  }
  requestAnimationFrame(pulse);
}
addEventListener("resize",()=>{ if(mode!=="jelajah") moveCamera(); });

/* ---------- boot ---------- */
renderText();
initMap();
const h0 = location.hash.slice(1);
setMode(["cerita","galeri","jelajah"].includes(h0) ? h0 : "cerita", true);
</script>
