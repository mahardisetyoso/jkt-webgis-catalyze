<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Redesign · How it works — Tiga mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/phosphor-icons/2.1.1/regular/style.min.css" />
<style>
  :root{
    --bg:#181818; --surface-1:#1F1F1F; --surface-2:#272727; --surface-3:#313131;
    --ink:#FFFFFF; --ink-2:#B5B5B5; --ink-3:#8A8A8A;
    --line:rgba(255,255,255,.09);
    --accent:#E0A458; --accent-ink:#1a1206;
    --ease:cubic-bezier(0.22,1,0.36,1);
    --s4:4px;--s8:8px;--s12:12px;--s16:16px;--s24:24px;--s32:32px;
    --s40:40px;--s48:48px;--s64:64px;--s80:80px;--s96:96px;
    --r-md:6px;--r-lg:8px;--r-xl:12px;--r-2xl:16px;--r-full:9999px;
    --d-jakpus:#f4a261; --d-jakbar:#2ec4b6; --d-jaksel:#c77dff;
    --d-jakut:#4cc9f0; --d-jaktim:#90be6d;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1280px;margin:0 auto;padding:var(--s96) var(--s48)}
  @media (max-width:720px){.wrap{padding:var(--s64) var(--s24)}}

  .head{max-width:680px;margin-bottom:var(--s48)}
  .eyebrow-row{display:flex;align-items:center;gap:var(--s8);margin-bottom:var(--s16)}
  .eyebrow-row .bar{width:28px;height:1px;background:var(--accent)}
  .eyebrow{font-size:14px;font-weight:500;letter-spacing:.04em;color:var(--ink-2)}
  h2{margin:0 0 var(--s16);font-size:clamp(32px,5vw,48px);line-height:1.04;
    font-weight:600;letter-spacing:-.02em}
  .head p{margin:0;font-size:18px;line-height:28px;color:var(--ink-2)}

  .layout{display:grid;grid-template-columns:340px 1fr;gap:var(--s48);align-items:start}
  @media (max-width:980px){.layout{grid-template-columns:1fr;gap:var(--s32)}}

  /* step selector (left) */
  .steps{display:flex;flex-direction:column;gap:var(--s12)}
  @media (max-width:980px){.steps{flex-direction:row;overflow-x:auto}}
  .step{text-align:left;cursor:pointer;font-family:inherit;color:var(--ink-2);
    border:1px solid var(--line);border-radius:var(--r-2xl);background:var(--surface-1);
    padding:var(--s24);display:flex;gap:var(--s16);align-items:flex-start;min-width:260px;
    transition:border-color .3s var(--ease),background .3s var(--ease),transform .5s var(--ease)}
  .step:hover{border-color:rgba(224,164,88,.5);transform:translateY(-2px)}
  .step[aria-selected="true"]{background:var(--surface-2);border-color:var(--accent)}
  .step:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .step .n{font-family:"Geist Mono",monospace;font-size:13px;font-weight:600;color:var(--accent)}
  .step .ic{font-size:22px;color:var(--ink);line-height:1}
  .step h3{margin:0 0 var(--s4);font-size:17px;font-weight:600;color:var(--ink)}
  .step p{margin:0;font-size:13px;line-height:19px;color:var(--ink-3)}
  .step[aria-selected="true"] p{color:var(--ink-2)}

  /* preview device (right) */
  .device{border:1px solid var(--line);border-radius:var(--r-2xl);background:var(--surface-1);
    overflow:hidden;min-height:460px;display:flex;flex-direction:column}
  .device-bar{display:flex;align-items:center;gap:var(--s12);padding:var(--s12) var(--s16);
    border-bottom:1px solid var(--line);background:var(--surface-2)}
  .device-bar .dots{display:flex;gap:6px}
  .device-bar .dots i{width:10px;height:10px;border-radius:var(--r-full);background:var(--surface-3)}
  .device-bar .modes{display:flex;gap:var(--s4);margin-left:auto;background:var(--bg);
    border:1px solid var(--line);border-radius:var(--r-full);padding:var(--s4)}
  .device-bar .modes b{font-size:12px;font-weight:500;color:var(--ink-3);padding:4px var(--s12);
    border-radius:var(--r-full);transition:all .3s var(--ease)}
  .device-bar .modes b.on{background:var(--accent);color:var(--accent-ink)}
  .stage{position:relative;flex:1;padding:var(--s24);display:flex;gap:var(--s24)}

  /* schematic map (shared) */
  .mini{position:relative;flex:1;border-radius:var(--r-xl);background:var(--bg);
    border:1px solid var(--line);overflow:hidden;min-height:320px}
  svg.schema{position:absolute;inset:0;width:100%;height:100%}
  svg.schema .poly{fill:none;stroke:var(--c);stroke-width:2;stroke-opacity:.8;
    transition:fill-opacity .4s var(--ease),stroke-opacity .3s var(--ease)}
  .mini.thematic svg .poly{fill:var(--c);fill-opacity:.42}
  .mini:not(.boundary) svg .poly{stroke-opacity:0}
  svg.schema .lmk{fill:#fff;stroke:var(--bg);stroke-width:1.5;transition:opacity .3s var(--ease)}
  .mini:not(.landmark) svg .lmk{opacity:0}
  /* camera focus ring (story mode) */
  .cam{position:absolute;border:2px solid var(--accent);border-radius:var(--r-lg);
    box-shadow:0 0 0 2000px rgba(18,18,18,.55);opacity:0;transition:all .9s var(--ease)}
  .mini.story .cam{opacity:1}
  .scrollhint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
    font-size:11px;color:var(--ink-2);display:none;align-items:center;gap:6px}
  .mini.story .scrollhint{display:flex}

  /* gallery grid (gallery mode) */
  .gal{flex:1;display:none;grid-template-columns:repeat(3,1fr);gap:var(--s8);min-height:320px}
  .gal img{width:100%;height:100%;object-fit:cover;border-radius:var(--r-lg);border:1px solid var(--line);
    transition:transform .5s var(--ease)}
  .gal img:hover{transform:scale(1.04)}

  /* legend / filter panel (explore mode) */
  .legend{width:210px;flex-shrink:0;display:none;flex-direction:column;gap:var(--s12)}
  .legend .lg-title{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.04em}
  .toggle{display:flex;align-items:center;gap:var(--s12);cursor:pointer;
    border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface-2);padding:var(--s12)}
  .toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .toggle .sw{width:34px;height:20px;border-radius:var(--r-full);background:var(--surface-3);
    position:relative;flex-shrink:0;transition:background .3s var(--ease)}
  .toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;
    border-radius:var(--r-full);background:#fff;transition:transform .3s var(--ease)}
  .toggle.on .sw{background:var(--accent)}
  .toggle.on .sw::after{transform:translateX(14px)}
  .toggle .tx{font-size:13px;color:var(--ink)}
  .toggle .tx small{display:block;color:var(--ink-3);font-size:11px}

  /* mode visibility */
  .device[data-mode="gallery"] .mini{display:none}
  .device[data-mode="gallery"] .gal{display:grid}
  .device[data-mode="explore"] .legend{display:flex}
  .note{margin-top:var(--s16);font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
  .note i{color:var(--accent)}

  .reveal{opacity:0;transform:translateY(28px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
  .reveal.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head reveal">
    <div class="eyebrow-row"><span class="bar"></span><span class="eyebrow">Cara pakai</span></div>
    <h2>Tiga cara membaca kota</h2>
    <p>Satu peta, tiga mode. Pilih langkah di kiri untuk melihat masing-masing cara kerjanya — semua membaca lapisan yang sama dari GeoServer.</p>
  </header>

  <div class="layout reveal">
    <!-- step selector -->
    <div class="steps" role="tablist" aria-label="Mode peta">
      <button class="step" role="tab" aria-selected="true" data-mode="story">
        <span class="ic ph ph-scroll"></span>
        <span><span class="n">01</span><h3>Cerita</h3><p>Gulir, dan kamera menukik dari distrik ke distrik mengikuti alur naratif.</p></span>
      </button>
      <button class="step" role="tab" aria-selected="false" data-mode="gallery">
        <span class="ic ph ph-images"></span>
        <span><span class="n">02</span><h3>Galeri</h3><p>Semua landmark sebagai grid foto; klik untuk memperbesar.</p></span>
      </button>
      <button class="step" role="tab" aria-selected="false" data-mode="explore">
        <span class="ic ph ph-compass"></span>
        <span><span class="n">03</span><h3>Jelajah</h3><p>Pan & zoom bebas, nyalakan atau matikan lapisan sesukamu.</p></span>
      </button>
    </div>

    <!-- preview device -->
    <div class="device" data-mode="story" id="device">
      <div class="device-bar">
        <span class="dots"><i></i><i></i><i></i></span>
        <span class="modes">
          <b data-m="story" class="on">Cerita</b><b data-m="gallery">Galeri</b><b data-m="explore">Jelajah</b>
        </span>
      </div>
      <div class="stage">
        <div class="mini story boundary landmark" id="mini">
          <svg class="schema" viewBox="0 0 320 300" preserveAspectRatio="xMidYMid meet">
            <rect class="poly" style="--c:var(--d-jakut)"  x="30"  y="24"  width="260" height="52" rx="8"/>
            <rect class="poly" style="--c:var(--d-jakbar)" x="30"  y="92"  width="86"  height="104" rx="8"/>
            <rect class="poly" style="--c:var(--d-jakpus)" x="128" y="92"  width="64"  height="72"  rx="8"/>
            <rect class="poly" style="--c:var(--d-jaktim)" x="204" y="92"  width="86"  height="184" rx="8"/>
            <rect class="poly" style="--c:var(--d-jaksel)" x="30"  y="208" width="162" height="68"  rx="8"/>
            <circle class="lmk" cx="150" cy="122" r="4"/><circle class="lmk" cx="70" cy="140" r="4"/>
            <circle class="lmk" cx="245" cy="170" r="4"/><circle class="lmk" cx="90" cy="240" r="4"/>
            <circle class="lmk" cx="160" cy="50" r="4"/>
          </svg>
          <div class="cam" id="cam" style="left:128px;top:92px;width:64px;height:72px"></div>
          <div class="scrollhint"><i class="ph ph-mouse-scroll"></i> Gulir untuk pindah distrik</div>
        </div>

        <!-- gallery -->
        <div class="gal">
          <img src="img/scbd.jpg" alt="SCBD" onerror="this.src='https://picsum.photos/seed/scbd/300/300'">
          <img src="img/trisakti.jpg" alt="Trisakti" onerror="this.src='https://picsum.photos/seed/tri/300/300'">
          <img src="img/mbloc.jpg" alt="M Bloc" onerror="this.src='https://picsum.photos/seed/mbloc/300/300'">
          <img src="img/pik.jpg" alt="PIK" onerror="this.src='https://picsum.photos/seed/pik/300/300'">
          <img src="img/glodok.jpg" alt="Glodok" onerror="this.src='https://picsum.photos/seed/glo/300/300'">
          <img src="img/pulogadung.jpg" alt="Pulogadung" onerror="this.src='https://picsum.photos/seed/pul/300/300'">
        </div>

        <!-- legend/filter -->
        <div class="legend" id="legend">
          <span class="lg-title">LAPISAN</span>
          <button class="toggle on" data-layer="boundary"><span class="sw"></span><span class="tx">Batas kota<small>Polygon distrik</small></span></button>
          <button class="toggle on" data-layer="landmark"><span class="sw"></span><span class="tx">Landmark<small>Titik tematik</small></span></button>
          <button class="toggle" data-layer="thematic"><span class="sw"></span><span class="tx">Tematik<small>Choropleth isian</small></span></button>
        </div>
      </div>
      <div style="padding:0 var(--s24) var(--s24)">
        <div class="note" id="note"><i class="ph ph-stack"></i> Mode membaca lapisan yang sama — WFS/WMTS GeoServer, bukan data baru.</div>
      </div>
    </div>
  </div>
</div>

<script>
  const device=document.getElementById("device");
  const mini=document.getElementById("mini");
  const cam=document.getElementById("cam");
  const steps=[...document.querySelectorAll(".step")];
  const modeTags=[...document.querySelectorAll(".modes b")];
  // camera presets (schematic px) echoing the idea of lib/mapViews.ts
  const CAM={jakpus:[128,92,64,72],jakbar:[30,92,86,104],jaksel:[30,208,162,68],
             jakut:[30,24,260,52],jaktim:[204,92,86,184]};
  const order=["jakpus","jakbar","jaksel","jakut","jaktim"]; let ci=0, timer=null;

  function moveCam(id){const[a,b,w,h]=CAM[id];cam.style.left=a+"px";cam.style.top=b+"px";
    cam.style.width=w+"px";cam.style.height=h+"px";}
  function startStory(){stopStory();timer=setInterval(()=>{ci=(ci+1)%order.length;moveCam(order[ci]);},1600);}
  function stopStory(){if(timer){clearInterval(timer);timer=null;}}

  function setMode(m){
    device.dataset.mode=m;
    mini.className="mini "+m+(m==="explore"?" "+exploreLayers():"")+(m==="story"?" boundary landmark":"");
    if(m==="story"){mini.classList.add("boundary","landmark");startStory();} else stopStory();
    steps.forEach(s=>s.setAttribute("aria-selected", s.dataset.mode===m));
    modeTags.forEach(t=>t.classList.toggle("on", t.dataset.m===m));
  }
  // explore layer state
  const layers={boundary:true,landmark:true,thematic:false};
  function exploreLayers(){return Object.keys(layers).filter(k=>layers[k]).join(" ");}
  function applyExplore(){mini.className="mini explore "+exploreLayers();}

  steps.forEach(s=>s.addEventListener("click",()=>setMode(s.dataset.mode)));
  modeTags.forEach(t=>t.addEventListener("click",()=>setMode(t.dataset.m)));
  document.querySelectorAll(".toggle").forEach(tg=>{
    tg.addEventListener("click",()=>{
      const k=tg.dataset.layer; layers[k]=!layers[k];
      tg.classList.toggle("on",layers[k]);
      if(device.dataset.mode==="explore") applyExplore();
    });
  });

  // reveal
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add("in");}),{threshold:.2});
  document.querySelectorAll(".reveal").forEach(n=>io.observe(n));
  setMode("story");
</script>
</body>
</html>
