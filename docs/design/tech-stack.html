<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech Stack — Jakarta WebGIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#181818;--s1:#1F1F1F;--s2:#272727;--s3:#313131;--ink:#FFFFFF;--ink2:#B5B5B5;--ink3:#8A8A8A;--line:rgba(255,255,255,.09);--accent:#E0A458;--accent-ink:#1a1206;--ease:cubic-bezier(0.22,1,0.36,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.wrap{max-width:1440px;margin:0 auto;padding:56px 64px;display:flex;flex-direction:column;gap:32px;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap}
.kicker{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.08em;color:var(--ink3)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:pulse 1.8s ease-in-out infinite}
h1{margin:10px 0;font-size:56px;line-height:60px;font-weight:700;letter-spacing:-.03em}
.lead{margin:0;font-size:17px;line-height:26px;color:var(--ink2);max-width:640px}
.legend{display:flex;gap:20px;margin-top:14px;font-size:13px;color:var(--ink3)}
.legend span{display:flex;align-items:center;gap:8px}
.chip{width:14px;height:14px;border-radius:4px;border:1px solid var(--ink3)}
.chip.plan{border-style:dashed}
.chip.live{background:var(--accent);border-color:var(--accent)}
.tabs{display:flex;gap:4px;padding:6px;background:var(--s1);border:1px solid var(--line);border-radius:9999px;flex-wrap:wrap}
.tab{min-height:44px;padding:0 16px;border:0;border-radius:9999px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;background:transparent;color:var(--ink3);transition:background .3s var(--ease),color .3s var(--ease)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.body{display:flex;gap:32px;flex-wrap:wrap}
.grid{flex:999 1 640px;min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:84px;gap:12px;align-content:start}
.card{position:relative;border:1px solid var(--line);background:var(--s1);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;text-align:left;animation:rise .6s var(--ease) backwards;transition:opacity .35s var(--ease),border-color .25s var(--ease),transform .3s var(--ease),background .25s}
.card:hover{transform:translateY(-3px)}
.card.plan{border-style:dashed;border-color:rgba(255,255,255,.16);background:transparent}
.card.dim{opacity:.16}
.card[aria-pressed="true"]{border-color:var(--accent);border-style:solid;background:var(--s2)}
.mon{flex:none;width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:13px;background:var(--s3);color:var(--ink2)}
.card.live .mon{background:rgba(224,164,88,.14);color:var(--accent)}
.ct{display:flex;flex-direction:column;gap:3px;min-width:0}
.nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vr{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
aside{flex:1 1 340px;max-width:400px;padding:28px;background:var(--s1);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;gap:20px}
aside.swap{animation:slide .45s var(--ease)}
.dh{display:flex;align-items:center;gap:16px}
.big{width:60px;height:60px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:500;flex:none}
.dn{font-size:24px;font-weight:700;line-height:30px;letter-spacing:-.01em}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.badge{font-size:11px;padding:3px 8px;border-radius:9999px;border:1px solid var(--line);color:var(--ink2)}
.badge.live{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.badge.plan{border-style:dashed}
.lbl{font-size:11px;letter-spacing:.08em;color:var(--ink3);display:block;margin-bottom:6px}
.role{font-size:16px;line-height:24px}
.why{font-size:15px;line-height:23px;color:var(--ink2)}
.where{margin-top:auto;padding-top:16px;border-top:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{padding:16px 20px;background:var(--s1);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:10px;animation:rise .6s var(--ease) backwards}
.sv{font-size:28px;font-weight:700;letter-spacing:-.02em}.sl{font-size:14px;color:var(--ink3);margin-left:10px}
.track{height:4px;border-radius:2px;background:var(--s3);overflow:hidden}
.bar{height:4px;transform-origin:left;animation:grow 1.2s var(--ease) backwards}
footer{font-size:13px;color:var(--ink3)}footer a{color:var(--accent)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes slide{from{opacity:0;transform:translateX(24px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,164,88,.5)}50%{box-shadow:0 0 0 8px rgba(224,164,88,0)}}
@media (max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){.wrap{padding:32px 16px}h1{font-size:40px;line-height:44px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}aside{max-width:none}}
@media (max-width:520px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="kicker mono"><span class="dot"></span><span>JAKARTA — LIMA WAJAH SATU KOTA · WEBGIS STORYTELLING</span></div>
      <h1>Tech Stack</h1>
      <p class="lead">Frontend statis di CDN yang membaca data geospasial live dari backend open-source. Aplikasinya tidak butuh server; datanya yang butuh.</p>
      <div class="legend"><span><i class="chip live"></i>Di repo hari ini</span><span><i class="chip plan"></i>Direncanakan (backend live)</span></div>
    </div>
    <div class="tabs" role="tablist" aria-label="Filter layer" id="tabs"></div>
  </header>
  <div class="body">
    <div class="grid" id="grid"></div>
    <aside id="detail" aria-live="polite"></aside>
  </div>
  <div class="stats" id="stats"></div>
  <footer>Lihat juga <a href="architecture.html">Diagram Arsitektur →</a></footer>
</div>
<script>
const LAYERS = {
  fe: 'Frontend statis',
  be: 'Backend live',
  au: 'Authoring',
  data: 'Data pipeline',
  ops: 'Delivery & QA'
};
// live: true = in this repo today; false = planned (architecture §6)
const ITEMS = [
  { id: 'nextjs', mono: 'NX', name: 'Next.js 14', ver: 'App Router · output: export', layer: 'fe', live: true, role: 'Static export ke out/; tanpa SSR atau serverless, di POC maupun mode live.', why: 'Cerita sama untuk setiap pengunjung, jadi aplikasinya cukup statis di CDN. Hanya tier data yang butuh server.', where: 'app/ · next.config.mjs' },
  { id: 'ts', mono: 'TS', name: 'TypeScript', ver: 'narasi bertipe', layer: 'fe', live: true, role: 'Tipe untuk model chapter dan kamera.', why: 'Narasi adalah data: id distrik atau koordinat yang salah ketahuan saat build, bukan di depan pengunjung.', where: 'lib/ · types/' },
  { id: 'maplibre', mono: 'ML', name: 'MapLibre GL JS 4', ver: 'WebGL vector map', layer: 'fe', live: true, role: 'Kamera, highlight distrik, hover tooltip, landmark.', why: 'Open-source tanpa token. Abstraksi source-nya membaca GeoServer atau snapshot bawaan cukup dengan ganti URL.', where: 'components/MapCanvas.tsx · lib/mapLayers.ts' },
  { id: 'scrollama', mono: 'SC', name: 'Scrollama 3', ver: 'scroll-driven trigger', layer: 'fe', live: true, role: 'Memicu chapter saat panel masuk viewport.', why: 'Ringan, berbasis IntersectionObserver; tiap panel memicu flyTo kamera, highlight batas, dan landmark.', where: 'components/v2/ScrollerV2.tsx' },
  { id: 'maptiler', mono: 'MT', name: 'MapTiler', ver: 'dataviz-dark · OSM fallback', layer: 'fe', live: true, role: 'Basemap vektor dengan key dibatasi domain.', why: 'Key memberi SLA; tanpa key aplikasi turun ke raster OSM yang digelapkan untuk dev lokal.', where: 'lib/basemap.ts' },
  { id: 'v2', mono: 'DS', name: 'Design system v2', ver: 'Manrope · token gelap', layer: 'fe', live: true, role: 'Satu bahasa visual untuk cerita, galeri, dan jelajah.', why: 'Manrope lewat next/font, permukaan gelap datar, satu aksen hangat, spacing/radius skala Tailwind. Tanpa framework CSS.', where: 'app/v2/v2.css · components/v2/' },
  { id: 'postgis', mono: 'PG', name: 'PostGIS', ver: 'EPSG:4326 · GiST', layer: 'be', live: false, role: 'Sumber kebenaran tunggal untuk batas distrik dan landmark.', why: 'Query spasial di server; GeoServer dan CI membacanya dengan role read-only.', where: 'architecture.md §6' },
  { id: 'geoserver', mono: 'GS', name: 'GeoServer', ver: 'WFS · WMTS · SLD', layer: 'be', live: false, role: 'API data yang dipanggil aplikasi statis dari browser.', why: 'Standar OGC: WFS GeoJSON langsung terbaca source MapLibre; styling terpusat.', where: 'architecture.md §6' },
  { id: 'gwc', mono: 'GW', name: 'GeoWebCache', ver: 'tile cache', layer: 'be', live: false, role: 'Pre-render layer berat atau jarang berubah.', why: 'Tile yang sudah di-cache tidak di-query ulang per tampilan.', where: 'di dalam GeoServer' },
  { id: 'nginx', mono: 'NG', name: 'nginx gateway', ver: 'TLS · rate limit · cache', layer: 'be', live: false, role: 'Pintu depan GeoServer, hanya dijangkau lewat rewrite /geo/*.', why: 'Admin GeoServer tidak pernah publik; cache respons mengurangi beban.', where: 'architecture.md §6.5' },
  { id: 'docker', mono: 'DC', name: 'Docker Compose', ver: 'postgis · geoserver · nginx', layer: 'be', live: false, role: 'Menjalankan backend secara reproducible.', why: 'Sama di laptop dan VM. Alternatif terkelola: RDS / Cloud SQL + kontainer GeoServer.', where: 'architecture.md §8' },
  { id: 'qgis', mono: 'QG', name: 'QGIS Desktop', ver: 'SLD / QML', layer: 'au', live: false, role: 'Edit geometri dan atribut langsung di PostGIS; analisis spasial.', why: 'Gratis, kuat untuk kartografi, dan bisa menerbitkan gaya ke GeoServer. Dipakai analis, tidak dipanggil aplikasi.', where: 'architecture.md §6.1' },
  { id: 'gadm', mono: 'GA', name: 'GADM 4.1', ver: 'ADM2 · JakartaRaya', layer: 'data', live: true, role: 'Batas lima kota administrasi.', why: 'Hari ini mengisi snapshot langsung; saat live jadi seed PostGIS sekali. Lisensi non-komersial, geoBoundaries untuk build publik.', where: 'scripts/build-districts.mjs' },
  { id: 'mapshaper', mono: 'MS', name: 'mapshaper', ver: 'simplifikasi · ~13 KB', layer: 'data', live: true, role: 'Memangkas ukuran geometri batas wilayah.', why: 'Geometri ringan berarti muat cepat lewat CDN, termasuk di ponsel.', where: 'district build' },
  { id: 'gdal', mono: 'OG', name: 'GDAL / ogr2ogr', ver: 'PostGIS → GeoJSON', layer: 'data', live: false, role: 'Ekspor snapshot GeoJSON dari PostGIS sebelum next build.', why: 'Fallback selalu salinan data live, bukan dataset kedua yang bisa melenceng.', where: 'langkah CI · architecture.md §6.6' },
  { id: 'etl', mono: 'ET', name: 'Live data ETL', ver: 'upsert ke PostGIS', layer: 'data', live: false, role: 'Memasukkan layer yang sering berubah ke PostGIS.', why: 'Data live masuk satu pintu, lalu tersaji lewat GeoServer tanpa deploy ulang frontend.', where: 'roadmap v3' },
  { id: 'vercel', mono: 'VC', name: 'Vercel', ver: 'Edge CDN', layer: 'ops', live: true, role: 'Hosting aplikasi statis dan snapshot; satu origin untuk browser.', why: 'Git integration membangun setiap push dengan preview PR. NEXT_PUBLIC_* di-inline saat build.', where: 'jkt-webgis-catalyze.vercel.app' },
  { id: 'rewrite', mono: 'RW', name: 'Rewrite /geo/*', ver: 'vercel.json', layer: 'ops', live: false, role: 'Meneruskan request data live ke gateway.', why: 'Satu domain, tanpa CORS, alamat GeoServer tersembunyi.', where: 'vercel.json' },
  { id: 'github', mono: 'GH', name: 'GitHub', ver: 'source · PR preview', layer: 'ops', live: true, role: 'Repositori dan alur review.', why: 'Setiap PR mendapat URL preview dari Vercel.', where: 'feature branch → main' },
  { id: 'vitest', mono: 'VT', name: 'Vitest', ver: 'Testing Library · 49 tes', layer: 'ops', live: true, role: 'Unit test model chapter/kamera, helper paint, komponen.', why: 'Cepat dan tanpa browser sungguhan (jsdom).', where: 'tests/ · vitest.config.ts' }
];
const TABS = [{ id: 'all', label: 'Semua' }, ...Object.entries(LAYERS).map(([id, label]) => ({ id, label }))];
const liveCount = ITEMS.filter((i) => i.live).length;
const STATS = [
  { value: String(ITEMS.length), label: 'teknologi', pct: 1 },
  { value: String(liveCount), label: 'di repo hari ini', pct: liveCount / ITEMS.length },
  { value: String(ITEMS.length - liveCount), label: 'direncanakan', pct: (ITEMS.length - liveCount) / ITEMS.length },
  { value: '49', label: 'unit test', pct: 0.7 }
];
const state = { filter: 'all', sel: 'maplibre' };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

$('tabs').innerHTML = TABS.map((t) => `<button class="tab" role="tab" data-id="${t.id}" aria-selected="false">${esc(t.label)}</button>`).join('');
$('grid').innerHTML = ITEMS.map((it, i) => `<button class="card ${it.live ? 'live' : 'plan'}" data-id="${it.id}" aria-pressed="false" style="animation-delay:${i * 40}ms">
  <span class="mon mono">${it.mono}</span>
  <span class="ct"><span class="nm">${esc(it.name)}</span><span class="vr mono">${esc(it.ver)}</span></span></button>`).join('');
$('stats').innerHTML = STATS.map((s, i) => `<div class="stat" style="animation-delay:${800 + i * 80}ms"><div><span class="sv">${esc(s.value)}</span><span class="sl">${esc(s.label)}</span></div>
  <div class="track"><div class="bar" style="width:${Math.round(s.pct * 100)}%;background:${i === 2 ? 'var(--ink3)' : 'var(--accent)'};animation-delay:${800 + i * 80}ms"></div></div></div>`).join('');

function render() {
  document.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.id === state.filter)));
  document.querySelectorAll('.card').forEach((b) => {
    const it = ITEMS.find((x) => x.id === b.dataset.id);
    b.classList.toggle('dim', !(state.filter === 'all' || state.filter === it.layer));
    b.setAttribute('aria-pressed', String(it.id === state.sel));
  });
  const c = ITEMS.find((x) => x.id === state.sel);
  const d = $('detail');
  d.innerHTML = `<div class="dh"><span class="big mono" style="background:${c.live ? 'rgba(224,164,88,.14)' : 'var(--s3)'};color:${c.live ? 'var(--accent)' : 'var(--ink2)'}">${c.mono}</span>
    <div><div class="dn">${esc(c.name)}</div><div class="badges"><span class="badge mono">${esc(LAYERS[c.layer])}</span><span class="badge mono ${c.live ? 'live' : 'plan'}">${c.live ? 'Di repo' : 'Direncanakan'}</span></div></div></div>
    <div><span class="lbl mono">PERAN</span><span class="role">${esc(c.role)}</span></div>
    <div><span class="lbl mono">KENAPA DIPILIH</span><span class="why">${esc(c.why)}</span></div>
    <div class="where"><span class="lbl mono">${c.live ? 'DI REPO' : 'DIDESAIN DI'}</span><span class="mono" style="font-size:13px;color:${c.live ? 'var(--accent)' : 'var(--ink2)'}">${esc(c.where)}</span></div>`;
  d.classList.remove('swap'); void d.offsetWidth; d.classList.add('swap');
}
$('tabs').addEventListener('click', (e) => { const b = e.target.closest('.tab'); if (b) { state.filter = b.dataset.id; render(); } });
$('grid').addEventListener('click', (e) => { const b = e.target.closest('.card'); if (b) { state.sel = b.dataset.id; render(); } });
render();
</script>
</body>
</html>
